<mat-toolbar class="header-toolbar">
  <div class="logo-container">
    <span
      class="logo-main"
      routerLink="/"
      aria-label="Azeta Home"
      style="cursor: pointer;"
    >
      AZETA<sup class="reg-mark">®</sup>
    </span>
  </div>

  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Open menu">
    <span class="material-icons">menu</span>
  </button>

  <div class="menu-overlay" [class.open]="menuOpen" (click)="closeMenu()"></div>

  <nav class="nav-links" [class.open]="menuOpen" aria-label="Primary navigation">
    <a mat-button routerLink="/" (click)="closeMenu()" aria-label="Azeta Home">HOME</a>
    <a mat-button routerLink="/about" (click)="closeMenu()" aria-label="About Azeta">ABOUT</a>
    <a mat-button routerLink="/products" (click)="closeMenu()" aria-label="Azeta Products">PRODUCTS</a>
    <a mat-button routerLink="/contact" (click)="closeMenu()" aria-label="Contact Azeta">CONTACT</a>
  </nav>
</mat-toolbar>
